<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Severance ON · 좌석 QR 인쇄</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#162638;font-family:Arial,"Noto Sans KR",sans-serif;background:#eef3f7}
    main{width:min(100%,1100px);margin:auto;padding:36px}
    h1{margin:0;color:#003b78;font-size:30px}p{margin:8px 0 25px;color:#708092}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .card{padding:15px;border:1px solid #dbe4eb;border-radius:16px;background:#fff;text-align:center;break-inside:avoid}
    img{display:block;width:100%;height:auto}.seat{margin-top:8px;color:#003b78;font-size:22px;font-weight:900}
    .store{margin-top:3px;color:#718092;font-size:10px}.guide{margin-top:8px;font-size:9px;line-height:1.45}
    @media(max-width:700px){main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}}
    @media print{body{background:#fff}main{width:auto;padding:7mm}.grid{grid-template-columns:repeat(4,1fr);gap:3mm}.card{padding:3mm;border-radius:3mm}h1{font-size:20px}p{font-size:10px;margin-bottom:4mm}.seat{font-size:15px}.guide{font-size:7px}}
  </style>
</head>
<body>
  <main>
    <h1>Severance ON 좌석 QR</h1>
    <p>QR을 열면 해당 좌석의 이용 시작 기록이 좌석 현황에 반영됩니다.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const stores={A:"본관 푸드코트",B:"우리라운지",C:"암병원 델리",D:"종합관 카페"};
    const seats=[...Object.keys(stores).flatMap(prefix=>Array.from({length:5},(_,i)=>`${prefix}${String(i+1).padStart(3,"0")}`))];
    document.getElementById("grid").innerHTML=seats.map(seat=>`
      <article class="card">
        <img src="./images/${seat}.png" alt="${seat} 좌석 QR">
        <div class="seat">${seat}</div>
        <div class="store">${stores[seat[0]]}</div>
        <div class="guide">카메라로 QR을 열어<br>좌석 이용을 시작해 주세요.</div>
      </article>
    `).join("");
  </script>
</body>
</html>
